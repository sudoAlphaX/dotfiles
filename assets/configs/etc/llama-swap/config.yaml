healthCheckTimeout: 300
logToStdout: "proxy"

macros:
  server: "systemd-inhibit --what=sleep:shutdown --who='llama-server' --why='LLM model loaded' --mode=block llama-server --port ${PORT} --host ::"
  ctx: "-c 131072 -ngl 99 -fa on -ctk q8_0 -ctv q8_0"
  nothink: '--jinja --chat-template-kwargs ''{"enable_thinking": false}'' --temp 0.7 --top-p 0.8 --top-k 20 --min-p 0.0 --presence-penalty 1.0'
  think: "--jinja --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 1.0"
  mtp: "--spec-type draft-mtp --spec-draft-n-max 2"

models:
  "qwen3.5:4b-uncensored-aggressive":
    cmd: |
      ${server} ${ctx}
      -m /srv/models/gguf/HauhauCS__Qwen3.5-4B-Uncensored-HauhauCS-Aggressive__Qwen3.5-4B-Uncensored-HauhauCS-Aggressive-Q6_K.gguf
      ${nothink}
    ttl: 1800
  "qwen3.5:4b-uncensored-aggressive-think":
    cmd: |
      ${server} ${ctx}
      -m /srv/models/gguf/HauhauCS__Qwen3.5-4B-Uncensored-HauhauCS-Aggressive__Qwen3.5-4B-Uncensored-HauhauCS-Aggressive-Q6_K.gguf
      ${think}
    ttl: 1800

